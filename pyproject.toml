[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jenum"
version = "1.0"
description = "Dispatch Enums for Python — singleton constants with per-constant fields and per-constant method dispatch"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Dennis Vadura", email = "dennis.vadura@gmail.com"}
]
keywords = ["enum", "dispatch", "singleton", "metaclass", "denum", "mdenum", "jenum"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/jenum"
Repository = "https://github.com/yourusername/jenum"

[tool.setuptools]
package-dir = {"" = "Source"}
py-modules = ["jenum"]
